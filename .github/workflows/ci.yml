name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m ruff check --select F,I app migrations tests
        working-directory: backend
      - run: python -m compileall -q app migrations tests
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
        env:
          JWT_SECRET_KEY: ci-test-secret-with-more-than-thirty-two-characters

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_erp
          POSTGRES_USER: medical_erp
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medical_erp -d medical_erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://medical_erp:ci-postgres-password@localhost:5432/medical_erp
          JWT_SECRET_KEY: ci-test-secret-with-more-than-thirty-two-characters
      - run: python -m alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://medical_erp:ci-postgres-password@localhost:5432/medical_erp
          JWT_SECRET_KEY: ci-test-secret-with-more-than-thirty-two-characters

  production-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file backend/Dockerfile --tag medical-erp-api:ci .
      - run: docker build --file frontend/Dockerfile --tag medical-erp-web:ci .
      - name: Validate production Caddy configuration
        run: >-
          docker run --rm
          --env DOMAIN=erp.example.com
          --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.9-alpine
          caddy validate --config /etc/caddy/Caddyfile
